# Delimit fork-PR comment relay — OPTIONAL companion workflow.
#
# WHY: on pull requests from forks, GitHub downgrades GITHUB_TOKEN to
# read-only, so the Delimit action cannot post its PR comment (it falls back
# to the job summary). This workflow runs AFTER the schema-check workflow
# completes, in the BASE-REPO context with a writable token, downloads the
# report artifact, and posts the comment — fork contributors see the result
# in the PR thread.
#
# SECURITY MODEL (pwn-request-safe — read before adopting):
#   * `workflow_run` executes in the base repo with elevated permissions, so
#     this workflow NEVER checks out or executes anything from the PR. No
#     actions/checkout here, ever.
#   * The report artifact was produced in the UNTRUSTED PR context. It is
#     treated as DATA: rendered as inert markdown text in a comment body,
#     never evaluated, never interpolated into scripts, and length-capped.
#   * The PR number is derived from the TRUSTED workflow_run payload:
#     resolution requires EXACTLY ONE open PR matching both head_sha AND
#     head repo (commit-reuse defense — commits are shared across the fork
#     network, so a bare commit->PR lookup is forgeable). Never from
#     artifact contents, which an attacker controls.
#   * Only successful FORK-PR runs relay (same-repo PRs already got the
#     direct comment); @-mentions in report text are neutralized; actions
#     are SHA-pinned.
#   * Permissions are the minimum for the job: pull-requests: write.
#
# INSTALL: copy to .github/workflows/delimit-comment.yml in your repo and
# set `workflows:` to your schema-check workflow's `name:`.

name: Delimit PR Comment Relay

on:
  workflow_run:
    workflows: ["API Schema Check"]   # <- your delimit workflow's name
    types: [completed]

permissions:
  contents: read

jobs:
  comment:
    # Only relay SUCCESSFUL fork-PR runs: same-repo PRs already received
    # the direct comment (double-comment guard), and failed/cancelled
    # runs produce no trustworthy report.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Download report artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: delimit-report
          path: report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
        continue-on-error: true

      - name: Post comment from base-repo context
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          # Trusted payload values only — the artifact never supplies these.
          DELIMIT_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DELIMIT_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          DELIMIT_RUN_URL: ${{ github.event.workflow_run.html_url }}
        with:
          script: |
            const fs = require('fs');
            const headSha = process.env.DELIMIT_HEAD_SHA;
            const runUrl = process.env.DELIMIT_RUN_URL;

            // 1. Report file is DATA from the untrusted PR context.
            let report;
            try {
              report = JSON.parse(fs.readFileSync('report/delimit_report.json', 'utf8'));
            } catch (e) {
              console.log('No report artifact — nothing to relay.');
              return;
            }

            // 2. PR number from TRUSTED payload values, never from the artifact.
            //    COMMIT-REUSE DEFENSE (panel-demanded): commits are shared
            //    across the fork network, so an attacker can graft a victim
            //    PR's head commit onto their own fork PR and make a bare
            //    commit->PR lookup ambiguous. Resolution therefore requires
            //    EXACTLY ONE open PR whose head sha AND head repo both match
            //    the triggering run's trusted payload; anything else aborts.
            const headRepo = process.env.DELIMIT_HEAD_REPO;
            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: headSha,
            });
            const matches = (prs.data || []).filter(p =>
              p.state === 'open'
              && p.head && p.head.sha === headSha
              && p.head.repo && p.head.repo.full_name === headRepo);
            if (matches.length !== 1) {
              console.log(`PR resolution not unique (${matches.length} match(es) for `
                + `${headSha} @ ${headRepo}) — aborting, never guessing.`);
              return;
            }
            const pr = matches[0];

            // 3. Render the report as inert markdown. Numbers are coerced,
            //    free text is fenced and length-capped; nothing from the
            //    artifact is ever interpolated into code.
            const breaking = Number(report.breaking) || 0;
            const nonBreaking = Number(report.non_breaking) || 0;
            const cap = (s, n) => String(s == null ? '' : s).slice(0, n);
            // Neutralize @-mentions in attacker-influenced text: a report
            // body must never be able to ping users/teams from our comment.
            const noMention = (s) => s.replace(/@/g, '@\u200b');
            const detail = noMention(cap(report.summary_markdown || report.summary || '', 20000));

            let body = '## Delimit — merge gate for AI-written code\n\n';
            body += `**${breaking} breaking** · ${nonBreaking} compatible change(s)`;
            body += ` · [run](${runUrl})\n\n`;
            if (detail) {
              body += detail + '\n\n';
            }
            body += '_Relayed from the base repo because fork PRs cannot post comments directly._\n';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body,
            });
            console.log(`Commented on PR #${pr.number}.`);
